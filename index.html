{c:"Aktuelle Informationen",s:"Ein Chatbot ohne Internetzugriff antwortet selbstsicher: „Aktuell führt der FC Bayern München die Bundesliga-Tabelle mit 24 Punkten an.“",a:"check",e:"Ob das stimmt, hängt vom heutigen Tag ab. Ein Modell kennt nur Daten bis zu seinem Knowledge Cutoff – und klingt bei veralteten Infos genauso sicher wie bei aktuellen. Bei Tabellen, Preisen oder Nachrichten gilt: immer überprüfen.",v:"Die aktuelle Tabelle bei einer Live-Quelle nachsehen.",q:"bundesliga.com, DFL oder Kicker",u:[["https://www.bundesliga.com/","Bundesliga.com (Startseite, dort die Tabelle suchen)","Nur eine Live-Quelle zeigt den heutigen Tabellenstand. Eine Detailseite wurde nicht geprüft."]],n:"Informationsstand: Die Aussage ist zeitabhängig. Darum gibt es hier bewusst keine feste Lösung „wahr“ oder „falsch“.",t:"Knowledge Cutoff: Was danach passiert ist, kennt das Modell nicht – es sei denn, es sucht live im Netz."},
{c:"Angebliche Statistik",s:"Laut einer Studie der Universität Heidelberg (2023) nutzen 87,4 % aller Jugendlichen in Deutschland täglich KI-Chatbots für Hausaufgaben.",a:"check",e:"Ohne Link zur Studie lässt sich das nicht bestätigen. Für dieses Spiel wurde die Zahl bewusst erfunden. Sehr genaue Zahlen mit Nachkommastelle wirken seriös, werden von KI aber auch gern erfunden. Richtig ist: weder glauben noch verwerfen – prüfen.",v:"Studie per Titel und Autor suchen; Stichprobe, Jahr und Auftraggeber kontrollieren.",q:"z. B. JIM-Studie des Medienpädagogischen Forschungsverbunds Südwest",u:[["https://mpfs.de/app/uploads/2025/11/PM_JIM-2025.pdf","mpfs: Pressemitteilung zur JIM-Studie 2025","Echte Vergleichszahl: 74 % der 12- bis 19-Jährigen nutzen KI für Hausaufgaben oder zum Lernen (2024: 65 %) – nicht „87,4 % täglich“."]],n:"Die genannte Heidelberger Studie und die Zahl 87,4 % sind für das Spiel erfunden. Der Vergleichswert stammt aus der JIM-Studie 2025: Erhebung im Juni und Juli 2025, Veröffentlichung am 14.11.2025. Stand der Prüfung: 11.10.2026.",t:"Ethik: Erfundene Zahlen weiterzugeben verbreitet Fake News. Die Verantwortung bleibt beim Menschen."},
{c:"Erfundene Quelle",s:"Eine KI nennt diese Quelle: „Müller, K. (2021): Neuronale Netze im Alltag. Journal of Applied AI Ethics, 14(3), 112–129.“ Weil Autor, Jahr, Zeitschrift und Seitenzahlen angegeben sind, kann die Quelle nicht erfunden sein.",a:"fake",e:"Diese Quelle wurde für das Spiel erfunden. Eine vollständige Formatierung beweist nichts: Sprachmodelle kennen das Muster von Literaturangaben und können Quellen erzeugen, die echt aussehen, aber nie existiert haben – eine typische Halluzination.",v:"Titel in Google Scholar oder im Bibliothekskatalog suchen, DOI anklicken.",q:"Google Scholar, Bibliothekskatalog, doi.org",u:[["https://scholar.google.com/","Google Scholar (Suchwerkzeug)","Kein Beleg für die Quelle selbst, sondern ein Werkzeug, um zu prüfen, ob es sie gibt."],["https://www.doi.org/","doi.org (DOI-Auflösung)","Hier prüft man, ob eine angegebene DOI wirklich zu einem Artikel führt."]],t:"LLM: Es imitiert die Form einer Quellenangabe, ohne sie nachzuschlagen."

{c:"Technik",s:"Der Eiffelturm ist im Sommer bis zu 15 cm höher als im Winter.",a:"check",e:"Dass sich Metall bei Wärme ausdehnt und der Turm im Sommer minimal höher ist, stimmt. Beim Zahlenwert widersprechen sich aber die Quellen: Viele Seiten nennen bis zu 15 cm Höhenzuwachs. Die Betreiberseite spricht dagegen im Text von einigen Millimetern Höhenänderung (in der Einleitung stehen sogar „einige Zentimeter“) und von etwa 15 cm Durchmesser der Kreisbahn, die die Turmspitze bei einseitiger Sonneneinstrahlung beschreibt. Dass die Zahl 15 cm in beiden Zusammenhängen vorkommt, macht eine Verwechslung plausibel; bewiesen ist sie hier nicht. Der genaue Wert hängt von Temperaturspanne und Messung ab.",v:"Die Betreiberseite lesen und die Angabe mit der Rechnung zur Längenausdehnung (Länge mal Ausdehnungskoeffizient mal Temperaturdifferenz) vergleichen. Eine genaue Zentimeterzahl nur glauben, wenn die Quelle erklärt, was gemessen wurde.",q:"Betreiberseite der Tour Eiffel, Physik-Lehrbuch zur Wärmeausdehnung",u:[["https://www.toureiffel.paris/en/news/history-and-culture/why-does-eiffel-tower-change-size","Tour Eiffel: Why does the Eiffel Tower change size?","Betreiberseite: Wärmeausdehnung macht den Turm „einige Millimeter“ höher; die Spitze beschreibt bei einseitiger Sonne eine Kreisbahn von etwa 15 cm Durchmesser."]],n:"Andere Seiten nennen 12–15 cm Unterschied zwischen kalten Wintertagen und heißen Sommertagen; eine Messreihe dazu wurde hier nicht gefunden.",t:"KI: Eine bekannte Zahl kann in Texten mit einem anderen Sachverhalt vermischt sein. Bei Zahlen deshalb die Quelle prüfen."},
{c:"Medien",s:"Der berühmte Satz „Es gibt drei Arten von Lügen: Lügen, verdammte Lügen und Statistiken.“ stammt von Mark Twain.",a:"fake",e:"Twain zitierte den Satz 1907 in seiner Autobiografie, schrieb ihn aber ausdrücklich dem britischen Politiker Benjamin Disraeli zu. Auch für Disraeli gibt es keinen Beleg. Ähnliche Formulierungen stehen schon in Texten der frühen 1890er-Jahre; als wahrscheinlichster Urheber gilt der britische Politiker Charles Dilke (1891). Ganz eindeutig belegt ist das aber nicht. Ein Zitat wirkt nicht echt, nur weil ein bekannter Name daran hängt.",v:"Nach der ältesten Fundstelle fragen: Wer hat den Satz wann zuerst gedruckt? Findet man keine belegte Fundstelle, gilt die Zuschreibung als nicht belegt.",q:"Quote Investigator (Zitatforschung), Mark Twain Project (UC Berkeley)",u:[["https://quoteinvestigator.com/2022/06/22/lies-statistics/","Quote Investigator: Lies, Damned Lies, and Statistics","Zeitleiste der frühesten Fundstellen (ab 1891/92); Twain nennt 1907 Disraeli als Urheber."]],t:"LLM: Zitate werden oft mit berühmten Namen verbunden. Ein Sprachmodell wiederholt solche Zuschreibungen, ohne die Quelle zu prüfen."}];

{t:"Large Language Model (LLM)",i:"💬",
 what:"Ein Large Language Model (LLM) ist ein sehr großes Sprachmodell. Es wurde mit riesigen Textmengen trainiert und hat dabei Muster der Sprache gelernt. Ein LLM ist eine Art von KI, die auf Sprache spezialisiert ist. Nicht jede KI ist ein LLM: Ein Schachprogramm oder ein Spam-Filter ist KI, aber kein LLM.",
 how:"Ein LLM berechnet auf Grundlage des bisherigen Textes (des Kontexts), welcher Textbaustein mit hoher Wahrscheinlichkeit als Nächstes passt, und setzt die Antwort so Schritt für Schritt zusammen. Es prüft dabei nicht in einer Faktendatenbank, ob die Aussage stimmt. Der Fachartikel von Manfred Spitzer (2025) beschreibt das Prinzip ähnlich: Das Modell speichert, wie wahrscheinlich Wörter aufeinander folgen.",

 tools:"Manche KI-Systeme können zusätzlich im Internet suchen oder Dokumente auslesen. Das macht Antworten aktueller, ersetzt aber nicht die eigene Prüfung: Auch angezeigte Quellen musst du öffnen und lesen.",

{t:"Algorithmus",i:"⚙️",
 what:"Ein Algorithmus ist eine eindeutige Folge von Anweisungen, die eine Aufgabe in festen Schritten löst. Jeder Schritt ist nachvollziehbar: Dieselbe Eingabe führt bei denselben Regeln immer zum selben Ergebnis.",
 how:"Ein Algorithmus besteht aus Eingabe, Regeln und Ausgabe. Die Regeln entscheiden, was mit der Eingabe geschieht. Auch ein LLM rechnet Schritt für Schritt, aber es beruht auf gelernten Parametern und ist kein Regelwerk, das man Zeile für Zeile lesen kann. Der Algorithmus beschreibt die Schritte; das LLM ist ein trainiertes Modell, dessen Berechnungen auf diesen Parametern beruhen.",
 ex:"Eine einfache Wenn-dann-Regel: Wenn die Temperatur unter 5 Grad fällt, dann schalte die Heizung ein, sonst schalte sie aus. Eingabe: Temperatur. Regel: Vergleich mit 5 Grad. Ausgabe: Heizung an oder aus. Auch diese Station ist ein Algorithmus: Sie vergleicht deine Antwort mit der hinterlegten Lösung und zeigt die dazu gehörige Erklärung. Sie kennt nur die Lösungen, die ihr eingetragen wurden.",
 lim:"Das Ergebnis hängt von Eingabedaten und festgelegten Regeln ab. Ein Empfehlungssystem zeigt zum Beispiel vor allem Inhalte, die zu deinen bisherigen Klicks passen. Sind die Daten einseitig, wird das Ergebnis einseitig. Ein Algorithmus ist deshalb nicht automatisch intelligent, neutral oder fehlerfrei. Nicht jeder Algorithmus ist KI: Die Wenn-dann-Regel oben ist kein KI-System.",
 q:{t:"Ein Algorithmus wählt Bewerbungen aus. Seine Trainingsdaten stammen überwiegend aus früheren Einstellungen, bei denen bestimmte Gruppen benachteiligt wurden. Was ist plausibel?",o:["Der Algorithmus ist automatisch neutral, weil er keine Gefühle hat.","Er kann die frühere Benachteiligung übernehmen, weil Daten und Regeln das Ergebnis bestimmen.","Das Ergebnis ist immer fehlerfrei, weil Rechnen keine Fehler macht."],a:1,w:"Ein Algorithmus verarbeitet die Daten und Regeln, die man ihm gibt. Enthalten sie eine Benachteiligung, reproduziert er sie oft, ohne dass es auffällt."},
 src:"Grundbegriff der Informatik. Offen: In dieser Fassung ist noch keine Online-Quelle eingetragen (siehe Projektdokumentation)."},
{t:"Ethik",i:"⚖️",
 what:"Ethik fragt, was verantwortbar ist. Im Zusammenhang mit KI geht es um Fairness, Datenschutz, Transparenz, mögliche Vorurteile und die Frage, wer für Ergebnisse und deren Folgen verantwortlich ist.",
 how:"KI-Ergebnisse betreffen Menschen, zum Beispiel bei Bewerbungen, Noten, Empfehlungen oder Gesundheitsfragen. Fehler oder Vorurteile können dann echten Schaden anrichten. Verantwortlich sind Menschen: Entwickelnde, Anbieter, Organisationen, die KI einsetzen, und du als Nutzende. Die Verantwortung verschwindet nicht, weil eine Maschine geantwortet hat. Dazu gehören auch Fake News (falsche Informationen, die sich schnell verbreiten), das Urheberrecht (wer darf Texte und Bilder verwenden?) und der Datenschutz.",
 lim:"Nicht jede Aufgabe gehört an eine KI. Entscheidungen mit persönlicher Verantwortung, Mitgefühl oder schwer rückholbaren Folgen brauchen einen Menschen, der sie trifft und begründet. Verantwortungsvoll nutzen heißt: Du prüfst Ergebnisse, schützt persönliche Daten, weil Dienste sie je nach Anbieter verarbeiten oder speichern können, und machst deine KI-Nutzung sichtbar, wenn die Regeln es verlangen.",
 q:{t:"Du sollst für ein Referat eine KI-Hilfe nutzen. Die Zusammenfassung nennt keine Quelle. Was tust du?",o:["Ich übernehme die Zusammenfassung ungeprüft und lasse die fehlende Quelle weg.","Ich nutze die Zusammenfassung als Hilfe, suche selbst Quellen, prüfe die Angaben und kläre, wie ich die KI-Nutzung angebe.","Ich verschweige, dass ich eine KI genutzt habe, weil die Antwort gut klingt."],a:1,w:"Die zweite Option verbindet Nutzen mit Verantwortung: Die Angaben werden geprüft, und die Nutzung wird transparent gemacht. Welche Angabe genau nötig ist, legen die Regeln deiner Schule fest."},
 src:"Dormuth u. a. (2025): A Cautionary Tale About „Neutrally“ Informative AI Tools Ahead of the 2025 Federal Elections in Germany, arXiv:2502.15568, https://arxiv.org/pdf/2502.15568. Die Studie untersucht, ob KI-Tools zur Wahlinformation neutral sind oder Verzerrungen aus den zugrundeliegenden Sprachmodellen übernehmen."},
{t:"Knowledge Cutoff",i:"📅",
 what:"Der Knowledge Cutoff ist der zeitliche Stand der Trainingsdaten, mit denen ein KI-Modell gelernt hat. Was danach geschehen ist, fehlt im Trainingswissen des Modells.",
 how:"Jedes Modell hat einen eigenen Stand, und das genaue Datum wird nicht bei allen Systemen gleich angegeben. Der Stand bedeutet außerdem nicht, dass danach nie etwas aktualisiert wurde: Manche Systeme können zusätzlich aktuelle Quellen durchsuchen. Trainingswissen, spätere Aktualisierungen und Suchergebnisse sind drei verschiedene Dinge.",
 ex:"Eine KI nennt die aktuelle Tabellenführung der Bundesliga. Ihr Wissen stammt aus dem Training. Hat sich seitdem etwas geändert, kann sie das ohne aktuelle Suche nicht wissen, klingt aber trotzdem sicher. Die Lösung: die Tabelle bei einer aktuellen, offiziellen Quelle nachsehen.",
 lim:"Ein Knowledge Cutoff bedeutet nicht, dass alle Informationen vor diesem Stand korrekt oder vollständig sind. Die Trainingsdaten können ungleichmäßig sein und Fehler enthalten. Wenn du das genaue Stichdatum eines Modells nicht kennst, nimm kein Datum an, sondern frag beim Anbieter nach.",
 q:{t:"Eine KI sagt: „Mein Wissen reicht bis Mitte 2024.“ Was folgt daraus?",o:["Alles, was sie danach sagt, ist falsch.","Sie kennt Ereignisse nach diesem Stand nicht aus dem Training. Für aktuelle Angaben braucht man eine aktuelle Quelle.","Alles, was vor diesem Stand liegt, ist garantiert richtig."],a:1,w:"Ein Stand im Training heißt nicht, dass danach nichts stimmt, und nicht, dass davor alles stimmt. Entscheidend ist: Für aktuelle Angaben braucht man eine aktuelle Quelle. Ob ein System zusätzlich suchen kann, erfährst du beim Anbieter."},
 src:"Wikipedia (englisch), Artikel „Knowledge cutoff“, https://en.wikipedia.org/wiki/Knowledge_cutoff (Stand der Abfrage: 11.10.2026). Der Artikel nennt unter anderem, dass das Wissen eines Modells nicht zwingend dem Stichtag entspricht und dass Modelle selten neu trainiert werden. Das konkrete Datum eines bestimmten Modells ist hier bewusst nicht angegeben."}

const ptsCard=()=>`<div class="card"><p class="k">Punkte</p><h2>So werden Punkte vergeben</h2><ul><li>Hauptquiz: FAKT oder FAKE richtig +${P.fact}, NOCH ÜBERPRÜFEN richtig +${P.check} (maximal ${KMAX}). NOCH ÜBERPRÜFEN zählt weniger, weil es nur richtig ist, wenn eine Aussage wirklich unsicher oder kontextabhängig ist. So bleibt es keine bequeme Ausweichlösung.</li><li>Zusatz-Challenges: Punkte nur für nachweislich richtige Antworten (maximal ${BMAX})</li><li>Abzeichen für abgeschlossene Zusatz-Challenges (ohne Punkte)</li><li>Selbsteinschätzungen, Begründungen, Beobachtungen und Reflexion geben keine Punkte.</li></ul><p class="tg">Maximum: ${KMAX} + ${BMAX} = ${MAX} Punkte.</p></div>`;
function mission(){reset();go(`<section class="in"><p class="k">Deine Mission</p><h2>Finde heraus, was Fakt ist und was nur so klingt.</h2><p>Du bekommst ${C.length} Aussagen. Entscheide: <b>FAKT</b>, <b>FAKE</b> oder <b>NOCH ÜBERPRÜFEN</b>, wenn man es so nicht sicher sagen kann. Erst danach siehst du die Auflösung.</p><div class="card"><p class="k">Deine Mission</p><p>Eine KI kann eine Antwort überzeugend formulieren, obwohl sie falsch ist. <b>Deine Aufgabe ist es, herauszufinden, welchen Aussagen du vertrauen kannst und welche du überprüfen musst.</b></p><p><b>Was dich erwartet:</b></p><ul><li>12 Aussagen im Hauptquiz: Du entscheidest bei jeder zwischen FAKT, FAKE und NOCH ÜBERPRÜFEN.</li><li>Nach jeder Antwort liest du die Auflösung und erfährst, wie man die Aussage überprüft.</li><li>Du lernst, wie KI-Halluzinationen entstehen.</li><li>Freiwillig: 8 Zusatz-Challenges und 4 Lernbereiche.</li><li>Am Ende reflektierst du, was du über den Umgang mit KI gelernt hast.</li></ul><p class="tg">Es geht nicht darum, möglichst schnell Punkte zu sammeln. Entscheidend ist, dass du verstehst, warum eine Antwort richtig, falsch oder nicht ausreichend belegt ist.</p></div><div class="card"><p class="k">Der Lernweg</p><h2>Sechs Schritte, ein roter Faden</h2><ol><li><b>Entscheiden:</b> Was glaube ich zunächst? <span class="tg">Warum: Du hältst zuerst deine eigene Einschätzung fest.</span></li><li><b>Untersuchen:</b> Welche Behauptung soll überprüft werden? <span class="tg">Warum: Du machst aus einer Vermutung eine prüfbare Frage.</span></li><li><b>Überprüfen:</b> Welche zuverlässigen Quellen finde ich? <span class="tg">Warum: Erst eine geöffnete Quelle belegt eine Aussage.</span></li><li><b>Vergleichen:</b> Stimmen die Aussagen der KI mit den Quellen überein? <span class="tg">Warum: Zahl, Datum und Zusammenhang müssen passen.</span></li><li><b>Verstehen:</b> Warum kann eine KI überzeugend klingende, aber falsche Antworten geben? <span class="tg">Warum: Du erkennst das Muster, nicht nur das Ergebnis.</span></li><li><b>Reflektieren:</b> Was mache ich beim nächsten Mal anders? <span class="tg">Warum: Du nimmst die Regel für den nächsten KI-Einsatz mit.</span></li></ol></div><div class="card steps"><p class="k">So funktioniert’s</p><ol><li><b>Zuerst:</b> Lies die Aussage und wähle FAKT, FAKE oder NOCH ÜBERPRÜFEN.</li><li><b>Danach:</b> Begründe kurz und lies die Auflösung. „Warum?“ zeigt mehr Erklärung und Quellen.</li><li><b>Zum Schluss:</b> Gehe weiter, bis alle 12 Fragen beantwortet sind. Vorher kannst du jede Antwort ändern.</li><li><b>Danach optional:</b> Lernbereiche (KI, LLM, Algorithmus, Ethik) und die Zusatz-Challenges.</li></ol><p class="tg"><b>FAKT</b> = stimmt nachweislich · <b>FAKE</b> = falsch oder erfunden · <b>NOCH ÜBERPRÜFEN</b> = so nicht sicher sagbar.</p></div><p class="tg">Die 12 Fragen erscheinen bei jeder Runde in einer zufälligen Reihenfolge. Wenn du auf „Nochmal spielen“ klickst, werden sie erneut gemischt. Die Fragen, Antworten und Erklärungen bleiben dabei unverändert.</p><p>Tippe zuerst die ${T.length} Begriffe an:</p>${infobox()}<div class="card"><p class="k">Drei Kernaussagen</p><h2>A · Algorithmen wissen nicht von allein, was wahr ist</h2><p>Ein Algorithmus ist eine festgelegte Folge von Verarbeitungsschritten. Er prüft nicht automatisch, ob eine Aussage stimmt. KI ist ein Oberbegriff, und ein LLM ist eine Art von KI, die Sprache erzeugt. Nicht jede KI ist ein LLM, und nicht jeder Algorithmus ist KI.</p><h2>B · So entsteht eine Halluzination</h2><p>Eine KI-Halluzination ist eine Ausgabe, die plausibel klingt, aber falsche oder erfundene Informationen enthält. Ein Sprachmodell erzeugt Text anhand gelernter Muster und Wahrscheinlichkeiten. Es prüft nicht automatisch jede Behauptung anhand zuverlässiger Quellen. Darum kann eine Antwort überzeugend klingen und trotzdem falsch sein.</p><p class="tg">Nicht jede falsche KI-Antwort wurde absichtlich erfunden, und nicht jede KI-Antwort ist falsch. Die Ursachen können verschieden sein.</p><h2>C · Halluzinationen erkennst du durch Quellen</h2><p>Eine überzeugende Formulierung ist kein Beweis. Eine Quellenangabe hilft erst, wenn die Quelle existiert und die Aussage stützt. Aktuelle Angaben brauchen aktuelle Quellen. Findest du keine ausreichenden Belege, übernimm die Aussage nicht als gesicherte Tatsache.</p><p class="big">Eine technisch erzeugte Antwort ist nicht automatisch ein geprüfter Fakt.</p></div><div class="card"><p class="k">Datenschutz</p><h2>Was die Station speichert</h2><ul><li>Die Station speichert nichts dauerhaft. Antworten, Begründungen und Reflexionen bleiben nur im geöffneten Browser-Tab und sind weg, sobald du die Seite schließt oder neu lädst.</li><li>Der QR-Code lädt seine Grafik von api.qrserver.com. Dabei wird die Adresse der Station übertragen. Ohne Internet oder ohne öffentliche Adresse erscheint kein QR-Code.</li><li>Der Link „Externe KI öffnen“ führt zu einem fremden Dienst. Je nach Anbieter können Eingaben dort verarbeitet oder gespeichert werden. Gib keine echten Namen, Passwörter oder Adressen ein.</li><li>Kopieren legt nur den Text in deine Zwischenablage, den du selbst kopierst.</li></ul></div>${ptsCard()}<div class="row"><button class="b" onclick="show()">Karte 1 starten</button></div></section>`)}

/* ===== Hauptquiz ===== */
function show(){cardv()}
function cardv(){const i=seq[n],x=C[i],tp=TXP||"";TXP="";ch=null;go(`${hud()}<section class="card in"><p class="k">Frage ${n+1} · ${x.c}</p><h2 class="st">${x.s}</h2><div class="tbox"><p><b>Deine Aufgabe:</b> Entscheide, ob die Aussage FAKT, FAKE oder NOCH ÜBERPRÜFEN ist.</p><p><b>So gehst du vor:</b> 1. Antwort wählen · 2. kurz begründen · 3. Auflösung lesen.</p><p><b>Warum:</b> Du übst, eine überzeugende Behauptung von einer belegten Information zu unterscheiden.</p><p><b>Das solltest du erkennen:</b> Achte auf Zahlen, Quellen und Wörter wie „immer“ oder „garantiert“.</p></div><div class="row" role="group" aria-label="Deine Antwort">${["fact","fake","check"].map(k=>`<button class="ch" data-v="${k}" aria-pressed="false" onclick="pick('${k}')">${I[k]}</button>`).join("")}</div><div id="why" hidden><label class="k" for="tx" style="display:block;margin-top:16px">Deine Begründung (ein Satz genügt)</label><textarea id="tx" oninput="chk()" placeholder="Woran erkennst du das?">${esc(tp)}</textarea><div class="row"><button class="b" id="rv" onclick="reveal()" disabled>Auflösung anzeigen</button></div></div></section><div id="out"></div>`)}
function pick(k){if(R[seq[n]])return;ch=k;document.querySelectorAll(".ch").forEach(b=>{const on=b.dataset.v==k;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});$("why").hidden=false;chk()}
function chk(){$("rv").disabled=!(ch&&$("tx").value.trim().length>=4)}
function reveal(){const i=seq[n],x=C[i];if(R[i]||!ch)return;const ok=ch==x.a,p=ok?P[x.a]:0;R[i]={pick:ch,ok,pts:p,tx:$("tx").value};
document.querySelectorAll(".ch,#tx").forEach(e=>e.disabled=true);$("rv").hidden=true;count($("sc"),total());
$("out").innerHTML=`<div class="card res ${ok?"ok":"no"} in"><h2>${ok?`Richtig! <span class="pop">+${p}</span>`:"Nicht ganz – so ist es richtig:"}</h2><p class="st">Lösung: <b>${I[x.a]}</b></p><p>${AD[x.a]}</p>${ok?"":`<p class="tg">Du hattest ${L[ch]} gewählt. Der Prüfweg unten zeigt, woran man den Unterschied erkennt.</p>`}<p><b>So prüfst du es:</b> ${x.v}</p><p><b>Wichtigste Erkenntnis:</b> ${x.t||"Prüfe eine Behauptung mit einer Quelle, bevor du sie übernimmst."}</p><details class="why"><summary>Warum? Mehr Erklärung und Quellen</summary><p><b>Belegte Fakten und Einordnung:</b> ${x.e}</p>${srcHTML(x)}${x.t?`<p class="tg">🔗 ${x.t}</p>`:""}<p class="tg">Passende Lösungskarte in der Box: ${kid(i)}</p></details><p class="tg">Kurze Reflexion (ohne Punkte): Hat deine Begründung den Kernpunkt getroffen?</p><div class="row"><button class="b o" id="s1" onclick="selfchk(1)">Ja</button><button class="b o" id="s0" onclick="selfchk(0)">Nein oder teilweise</button></div><p id="sm" class="tg" role="status"></p><div class="row"><button class="b o" onclick="redo()">Antwort ändern</button><button class="b" onclick="nxt()">${n==seq.length-1?"Weiter zu den Zusatz-Challenges":"Weiter"}</button></div></div>`;
if(ok){const hb=document.querySelector(".ch.on");hb&&hb.classList.add("hit")}
say((ok?"Richtig. ":"Nicht ganz. ")+"Lösung: "+L[x.a]);
$("out").scrollIntoView({behavior:RM()?"auto":"smooth",block:"nearest"})}
function selfchk(v){const r=R[seq[n]];if(!r||r.self!==undefined)return;r.self=v;$("s1").disabled=true;$("s0").disabled=true;$("sm").textContent=v?"Gut – du hast den Kernpunkt getroffen.":"Kein Problem – lies die Erklärung noch einmal."}
function nxt(){if(!R[seq[n]])return;n++;n<seq.length?cardv():bonusHub()}

/* ===== Bonusbereich ===== */
function bonusHub(){const rows=CHALL.map(c=>{const d=B[c.k]&&B[c.k].done,p=(B[c.k]&&B[c.k].pts)||0;return `<div class="card chal${d?" done":""}"><div class="chal-h"><span class="ico" aria-hidden="true">${c.i}</span><div><p class="k">Zusatz ${c.n}${BP[c.k]?" · bis "+BP[c.k]+(BP[c.k]>1?" Punkte":" Punkt"):" · ohne Punkte"}</p><h2>${c.t}</h2><p class="tg">${c.s}</p><p class="tg"><b>Warum:</b> ${c.w}</p></div></div><div class="row" style="align-items:center"><button class="b${d?" o":""}" onclick="openC('${c.k}')">${d?"Ansehen":"Öffnen"}</button>${d?`<span class="badge">🏅 ${c.b}</span>`:""}${d&&BP[c.k]?`<span class="tg">${p} von ${BP[c.k]} Punkten</span>`:""}</div></div>`}).join("");
go(`<section class="in"><p class="k">Optional · Bonusbereich</p><h1 class="hd">Zusatz-Challenges</h1><div class="card"><p>Hauptquiz: <b>${mainPts()} von ${KMAX}</b> Punkten · Bonus: <b>${bonusPts()} von ${BMAX}</b> Punkten · <b>${bDone()} von ${CHALL.length}</b> abgeschlossen.</p><p>Die Zusatz-Challenges sind <b>optional</b>. Du musst nicht alle machen. Richtige Antworten bringen Punkte, abgeschlossene Aufgaben ein Abzeichen.</p><p class="tg"><b>Reguläre Runde:</b> das Hauptquiz mit 12 Fragen, ca. 8–12 Minuten. <b>Bonus:</b> alle 8 Challenges zusammen ca. 10 Minuten, je nach Zeit auch nur einzelne.</p></div>${rows}<div class="row"><button class="b o" onclick="home()">Zur Startseite</button><button class="b" onclick="end()">Zum Ergebnis</button></div></section>`)}
function openC(k){go(V[k]())}
function shell(k,inner){const c=CHALL.find(x=>x.k===k),d=B[k]&&B[k].done,p=(B[k]&&B[k].pts)||0;return `<section class="in"><div class="hud"><span>Zusatz-Challenge ${c.n} von ${CHALL.length}</span><span>${BP[k]?`${p} von ${BP[k]} Punkten`:"ohne Punkte"}</span></div><div class="card"><p class="k">Zusatz ${c.n} · ${c.t}</p><h2>${c.s}</h2><p class="tg"><b>Warum:</b> ${c.w}</p>${inner}${d?`<div class="fb ok"><p class="k">Abgeschlossen</p><p>Abzeichen: <span class="badge">🏅 ${c.b}</span></p></div>`:""}</div><div class="row"><button class="b o" onclick="bonusHub()">Zurück zu den Zusatz-Challenges</button></div></section>`}
function optBtn(k,i,t,s,right){let c="opt";if(s.ans===i)c+=" on";if(s.checked){if(i===right)c+=" right";else if(s.ans===i)c+=" wrong"}return `<button class="${c}" role="radio" aria-checked="${s.ans===i}" ${s.checked?"disabled":""} onclick="pickC('${k}',${i})"><span class="letter">${"ABCDEF"[i]}</span><span>${t}${s.checked&&i===right?" ✔":s.checked&&s.ans===i&&i!==right?" ✘":""}</span></button>`}
function pickC(k,i){const s=st(k);if(s.checked)return;s.ans=i;render(k)}
function setTF(i,v){const s=st("c2");if(s.checked)return;s.ans[i]=v;render("c2")}
function setZ(i,v){const s=st("c6");if(s.checked)return;s.ans[i]=v===""?null:+v;render("c6")}
const CHECK={c1:s=>s.ans!==null,c2:s=>s.ans.every(x=>x!==null),c3:s=>s.ans!==null,c4:s=>s.ans!==null,c5:s=>s.ans!==null,c6:s=>s.ans.every(x=>x!==null),c7:s=>s.ans!==null&&s.txt.trim().length>=4};
const GRADE={c1:s=>s.ans===Q1.a?1:0,c2:s=>s.ans.reduce((a,v,i)=>a+(v===TF[i].a?1:0),0),c3:s=>s.ans===F3.a?1:0,c4:s=>s.ans===QS.a?1:0,c5:s=>s.ans===PR5.a?1:0,c6:s=>s.ans.reduce((a,v,i)=>a+(v===Z6[i]?1:0),0),c7:()=>0};
function checkC(k){const s=st(k);if(s.checked||!CHECK[k](s))return;s.checked=true;B[k]={done:true,pts:GRADE[k](s)};render(k);say("Antwort geprüft.")}
function checkOwn5(){const s=st("c5");s.chk=PK.map(k=>k[1].test(s.own.toLowerCase()));render("c5")}
const V={};
V.c1=()=>{const s=st("c1"),ok=s.ans===Q1.a;return shell("c1",`<p class="st">${Q1.q}</p><div class="opts" role="radiogroup" aria-label="Antwortmöglichkeiten">${Q1.o.map((t,i)=>optBtn("c1",i,t,s,Q1.a)).join("")}</div>${s.checked?fb(ok,ok?"Richtig! +1 Punkt":"Nicht ganz – die richtige Antwort ist markiert.",Q1.e):""}<div class="row">${s.checked?"":`<button class="b" ${s.ans===null?"disabled":""} onclick="checkC('c1')">Antwort prüfen</button>`}</div>`)};
V.c2=()=>{const s=st("c2");const rows=TF.map((q,i)=>{const v=s.ans[i],ok=v===q.a;return `<div class="tfrow"><p>${q.t}</p><div class="tfb"><button class="${v===true?"on":""}" aria-pressed="${v===true}" ${s.checked?"disabled":""} onclick="setTF(${i},true)">Wahr</button><button class="${v===false?"on":""}" aria-pressed="${v===false}" ${s.checked?"disabled":""} onclick="setTF(${i},false)">Falsch</button></div>${s.checked?fb(ok,(ok?"✔ Richtig":"✘ Nicht ganz")+" – die Lösung ist „"+(q.a?"wahr":"falsch")+"“",q.e):""}</div>`}).join("");const pts=s.checked?s.ans.reduce((a,v,i)=>a+(v===TF[i].a?1:0),0):0;return shell("c2",`<p class="tg">Entscheide bei jeder Aussage: wahr oder falsch?</p>${rows}${s.checked?`<p class="st">${pts} von 3 richtig</p>`:""}<div class="row">${s.checked?"":`<button class="b" ${s.ans.every(x=>x!==null)?"":"disabled"} onclick="checkC('c2')">Antworten prüfen</button>`}</div>`)};
V.c3=()=>{const s=st("c3"),ok=s.ans===F3.a;const list=F3.s.map((t,i)=>{let c="sent";if(s.checked){if(i===F3.a)c+=" right";else if(s.ans===i)c+=" wrong"}else if(s.ans===i)c+=" on";return `<button class="${c}" aria-pressed="${s.ans===i}" ${s.checked?"disabled":""} onclick="pickC('c3',${i})">${t}</button>`}).join("");return shell("c3",`<span class="sim-tag">SIMULATION · erfundenes Beispiel</span><p>Hier ist eine <b>erfundene</b> KI-Antwort zur Übung. Genau <b>eine</b> Aussage ist falsch. Tippe die Aussage an, die du für falsch hältst.</p><div role="group" aria-label="Aussagen der KI-Antwort">${list}</div>${s.checked?fb(ok,ok?"Richtig! +1 Punkt":"Nicht ganz – markiert ist der Fehler.",F3.e+` <b>So prüfst du es:</b> Größenangaben kannst du in einem NASA-Faktenblatt nachsehen, zum Beispiel <a href="https://starchild.gsfc.nasa.gov/docs/StarChild/solar_system_level1/earth_satellites.html" target="_blank" rel="noopener noreferrer">NASA StarChild: Earth’s Natural Satellites</a>. Den Erddurchmesser findest du ebenfalls in einem NASA-Faktenblatt zur Erde. Stand der Abfrage: ${VDATE}. Zum Öffnen ist Internet nötig.`):""}<div class="row">${s.checked?"":`<button class="b" ${s.ans===null?"disabled":""} onclick="checkC('c3')">Antwort prüfen</button>`}</div>`)};
V.c4=()=>{const s=st("c4"),ok=s.ans===QS.a;const opts=QS.o.map((o,i)=>{let c="opt";if(s.ans===i)c+=" on";if(s.checked){if(i===QS.a)c+=" right";else if(s.ans===i)c+=" wrong"}return `<button class="${c}" role="radio" aria-checked="${s.ans===i}" ${s.checked?"disabled":""} onclick="pickC('c4',${i})"><span class="letter">${"AB"[i]}</span><span><b>${o.h}</b><br><span class="tg">${o.d}</span><br><i>${o.z}</i></span></button>`}).join("");return shell("c4",`<span class="sim-tag">SIMULATION · beide Quellen sind erfundene Beispiele</span><p class="st">Welche Quelle ist glaubwürdiger?</p><p class="tg">Achte auf Autor, Datum, Belege und Herkunft.</p><div class="opts">${opts}</div>${s.checked?fb(ok,ok?"Richtig! +1 Punkt":"Nicht ganz – Quelle B ist glaubwürdiger.",QS.e):""}<div class="row">${s.checked?"":`<button class="b" ${s.ans===null?"disabled":""} onclick="checkC('c4')">Antwort prüfen</button>`}</div>`)};
V.c5=()=>{const s=st("c5"),ok=s.ans===PR5.a;const own=`<div class="ai"><p class="k">Eigene Formulierung (optional, ohne Punkte)</p><p class="tg">Schreibe eine eigene, noch bessere Anweisung. Der Stichwortcheck sucht nur bestimmte Wörter wie „kritisch“, „Quelle“ oder „unsicher“. Er prüft weder deine Formulierung inhaltlich noch die Wahrheit einer Antwort.</p><textarea id="c5own" oninput="st('c5').own=this.value" placeholder="Deine eigene Anweisung …">${esc(s.own)}</textarea><div class="row"><button class="b o" onclick="checkOwn5()">Stichwörter prüfen</button></div>${s.chk?`<div class="fb ${s.chk.filter(Boolean).length>=2?"ok":"no"}">${PK.map((k,i)=>`<p class="ck ${s.chk[i]?"y":"n"}">${s.chk[i]?"✔":"✘"} ${k[0]}</p>`).join("")}</div>`:""}</div>`;return shell("c5",`<p class="st">Welcher Prompt liefert die bessere Antwort?</p><div class="opts" role="radiogroup" aria-label="Prompts">${PR5.o.map((t,i)=>optBtn("c5",i,t,s,PR5.a)).join("")}</div>${s.checked?fb(ok,ok?"Richtig! +1 Punkt":"Nicht ganz – die beste Anweisung ist markiert.",PR5.e):""}${own}<div class="row">${s.checked?"":`<button class="b" ${s.ans===null?"disabled":""} onclick="checkC('c5')">Antwort prüfen</button>`}</div>`)};
V.c6=()=>{const s=st("c6");const defs=DEF6.map((d,j)=>`<div><b>${"ABCDEF"[j]}</b> ${d}</div>`).join("");const rows=TERMS6.map((t,i)=>{const v=s.ans[i],ok=v===Z6[i];let extra="";if(s.checked)extra=ok?`<span class="ck y">✔ richtig</span>`:`<span class="ck n">✘ richtig wäre ${"ABCDEF"[Z6[i]]}</span>`;return `<div class="zrow"><b>${t}</b><div class="zc"><select aria-label="Erklärung für ${t}" ${s.checked?"disabled":""} onchange="setZ(${i},this.value)"><option value="">–</option>${DEF6.map((_,j)=>`<option value="${j}" ${v===j?"selected":""}>${"ABCDEF"[j]}</option>`).join("")}</select>${extra}</div></div>`}).join("");const pts=s.ans.reduce((a,v,i)=>a+(v===Z6[i]?1:0),0);return shell("c6",`<p class="tg">Wähle zu jedem Begriff die passende Erklärung (A–F). Jede richtige Zuordnung gibt 1 Punkt.</p><div class="defs">${defs}</div>${rows}${s.checked?fb(pts===6,`${pts} von 6 richtig`,"Die richtigen Zuordnungen stehen oben in der Liste. Wichtig ist, warum sie passen."):""}<div class="row">${s.checked?"":`<button class="b" ${s.ans.every(x=>x!==null)?"":"disabled"} onclick="checkC('c6')">Zuordnung prüfen</button>`}</div>`)};
const D7=[{e:"✅",t:"Übernehmen",x:"Passt gut ins Referat."},{e:"🔍",t:"Zuerst prüfen",x:"Selbst nach der Studie suchen."},{e:"💬",t:"Den Chatbot fragen",x:"Nachfragen, ob er sich sicher ist."}];
V.c7=()=>{const s=st("c7"),ok=s.ans===Q7.a;const tiles=D7.map((d,i)=>{let c="dec-b";if(s.ans===i)c+=" on";if(s.checked){if(i===Q7.a)c+=" right";else if(s.ans===i)c+=" wrong"}return `<button class="${c}" aria-pressed="${s.ans===i}" ${s.checked?"disabled":""} onclick="pickC('c7',${i})"><span class="em" aria-hidden="true">${d.e}</span><span>${d.t}</span><span class="tg">${d.x}</span></button>`}).join("");return shell("c7",`<p>${Q7.sc}</p><p class="st">Wie reagierst du verantwortungsvoll?</p><div class="dec" role="group" aria-label="Deine Entscheidung">${tiles}</div><label class="k" for="c7txt" style="display:block;margin-top:14px">Begründe deine Entscheidung in einem Satz</label><textarea id="c7txt" oninput="st('c7').txt=this.value;const b=$('c7btn');if(b)b.disabled=(st('c7').ans===null||this.value.trim().length<4)" ${s.checked?"disabled":""} placeholder="Weil …">${esc(s.txt)}</textarea>${s.checked?fb(ok,ok?"Gut entschieden – das ist auch die Musterlösung.":"Hier ist die Musterlösung",Q7.m):""}<div class="row">${s.checked?"":`<button class="b" id="c7btn" ${s.ans===null||s.txt.trim().length<4?"disabled":""} onclick="checkC('c7')">Entscheidung bestätigen</button>`}</div>`)};

function c8inner(){return `<p>Diese Seite enthält <b>keine eingebaute KI</b>. Du formulierst hier einen Prompt, kannst ihn in einem KI-Chat in einem anderen Fenster ausprobieren und die Antwort danach selbst bewerten. Ohne KI-Zugang gehst du die Beispiele durch oder gehst direkt weiter.</p>
<div class="bx-call"><p class="big">Deine Aufgabe: Überprüfe eine KI-Antwort selbst.</p><p>Du lässt eine echte KI eine interessante Tatsachenbehauptung formulieren und eine Quelle dafür nennen. Danach wählst du eine Aussage aus und prüfst sie mit einer unabhängigen, seriösen Quelle. Die KI liefert nur einen Vorschlag. Die Prüfung machst du.</p></div>${navigator.onLine?"":`<p><span class="tag">Offline</span> Du kannst den Prompt kopieren und später mit Internet testen. Alles andere hier funktioniert weiter.</p>`}
<h2>Was macht einen guten Prompt aus?</h2><p>Ein guter Prompt nennt <b>die Behauptung</b>, den <b>Maßstab</b> (kritisch prüfen), den <b>Wunsch nach Quellen</b> und die Bitte, <b>Unsicherheit offen zu sagen</b>. So kannst du die Antwort leichter nachprüfen.</p>
<div class="pcs"><div class="pc bad"><h3>❌ Schwacher Prompt</h3><p>„${BAD}“</p><p class="tg">Keine Behauptung, kein Maßstab, keine Quellen, keine Bitte um Unsicherheit.</p></div><div class="pc good"><h3>✅ Besserer Prompt</h3><p style="white-space:pre-line">${GOOD}</p><p class="tg">Behauptung, Maßstab, Quellenwunsch und Unsicherheit sind enthalten.</p></div></div>
<div class="bx-call"><p><b>Zwei getrennte Fragen:</b> (1) Wie gut ist dein <i>Prompt</i>? (2) Ist die <i>Antwort</i> wahr? Ein guter Prompt macht eine Antwort besser prüfbar, aber nicht wahr. Das erfährst du nur durch eigene Prüfung mit unabhängigen Quellen. Auch mit gutem Prompt kann eine KI Quellen erfinden oder Fakten falsch verbinden.</p></div>
<div class="tbox"><p><b>Voraussetzungen:</b> Ein Gerät mit Internetzugang. Manche KI-Dienste verlangen ein eigenes Konto oder sind nicht überall erreichbar. Klappt das bei dir nicht, arbeitest du mit der Beispielantwort weiter (weiter unten auf dieser Seite).</p><p><b>Datenschutz:</b> Externe KI-Dienste können Eingaben je nach Anbieter verarbeiten oder speichern. Gib keine echten Namen, Passwörter, Adressen oder andere persönliche Daten ein. Nimm ein unkritisches Beispielthema.</p><p><b>Die Untersuchung in 7 Schritten:</b> 1 Auftrag lesen · 2 Prompt eingeben oder verändern · 3 KI-Antwort lesen · 4 eine überprüfbare Behauptung markieren · 5 eine unabhängige, verlässliche Quelle suchen · 6 Quelle und Antwort vergleichen · 7 festhalten, was du herausgefunden hast.</p></div><h2>Schritt 1 · Fertiger Prompt</h2><p>Dieser Prompt bittet die KI um eine interessante Tatsachenbehauptung und eine überprüfbare Quelle. Er verlangt ausdrücklich, dass keine Quelle erfunden wird.</p>
<label class="k" for="cpx" style="display:block">Prompt zum Kopieren</label><textarea id="cpx" readonly style="min-height:200px">${CH_PROMPT}</textarea>
<div class="row"><button class="b" onclick="cpPrompt()">Prompt kopieren</button></div><p id="cpxm" class="tg" role="status"></p>
<h2>Schritt 2 · Echte KI öffnen</h2><p>Der Button öffnet <b>claude.ai</b> in einem neuen Tab. Die KI läuft dort beim Anbieter, nicht in dieser Seite. Gib dort keine persönlichen Daten ein.</p>
<div class="row"><a class="b" href="https://claude.ai/" target="_blank" rel="noopener noreferrer">Externe KI öffnen (claude.ai)</a></div><p class="tg">Alternativ eignet sich jeder andere KI-Chat, den du nutzen darfst.</p>
<h2>Schritt 3 · Prompt testen</h2><ol><li>Kopiere den fertigen Prompt aus Schritt 1.</li><li>Öffne die externe KI in einem anderen Tab, füge den Prompt ein und sende ihn ab.</li><li>Lies die Antwort vollständig, auch die Zahlen, Namen und Quellenangaben.</li></ol>
<h2>Optional · Eigener Prompt</h2><p>Behauptung zum Üben: <b>„Menschen nutzen nur 10 % ihres Gehirns.“</b> Schreibe einen eigenen Prompt dazu oder setze das Beispiel ein und ändere es.</p><label class="k" for="pt" style="display:block">Dein Prompt</label><textarea id="pt" placeholder="Formuliere hier deinen Prompt …"></textarea>
<div class="row"><button class="b o" onclick="$('pt').value=GOOD;say('Beispiel-Prompt eingesetzt')">Besseren Beispiel-Prompt einsetzen</button><button class="b" onclick="cp()" id="cb">Eigenen Prompt kopieren</button><button class="b o" onclick="test()">Prompt-Check (Stichwörter)</button></div><p id="cpm" class="tg" role="status"></p><div id="out"></div>
<h2>Schritt 4 · Deine Beobachtung der KI-Antwort</h2><p class="tg">Das ist deine eigene Einschätzung. Die Seite bewertet sie nicht, vergibt dafür keine Punkte und speichert sie nicht.</p><label class="k" for="ai" style="display:block">Was hat die KI geantwortet? (kurz zusammenfassen)</label><textarea id="ai" placeholder="Hier steht, was die KI geantwortet hat – oder: Ich habe keine KI genutzt."></textarea>
<fieldset><legend>Hat die KI Quellen genannt?</legend>${rad("q1",["Ja","Nein","Keine KI genutzt"])}</fieldset><fieldset><legend>Waren die Quellen überprüfbar (von dir gefunden oder geöffnet)?</legend>${rad("q2",["Ja","Teilweise","Nein","Nicht geprüft"])}</fieldset><fieldset><legend>Hat die KI Unsicherheiten kenntlich gemacht?</legend>${rad("q3",["Ja","Nein","Keine KI genutzt"])}</fieldset>
<h2>Checkliste zur kritischen Bewertung</h2>${CHK.map(q=>`<label class="cl"><input type="checkbox"><span>${q}</span></label>`).join("")}
<details class="card"><summary>Beispielantworten ansehen (vorgefertigt, keine echte KI)</summary><p class="k">SIMULATION · von uns geschriebene Texte, nicht von einer KI erzeugt</p><div class="sim"><b>So könnte eine Antwort auf den schwachen Prompt aussehen:</b><br>„Ja, das stimmt. Menschen nutzen tatsächlich nur etwa 10 % ihres Gehirns.“ (falsch, aber selbstsicher)</div><div class="sim"><b>So könnte eine Antwort auf den besseren Prompt aussehen:</b><br>Das ist ein verbreiteter Mythos. Bildgebende Verfahren (z. B. fMRT) zeigen, dass praktisch alle Hirnregionen genutzt werden, nur nicht alle gleichzeitig gleich stark. Unsicher ist, was „nutzen“ genau heißt. Zum Überprüfen: Lehrbücher der Neurowissenschaft, Übersichtsartikel (z. B. über PubMed), Fachgesellschaften.</div><p>Übung: Welche Beispielantwort lässt sich besser überprüfen – und woran erkennst du das?</p><p class="tg">Zum Selbstprüfen der Behauptung: <a href="https://www.bmj.com/content/335/7633/1288" target="_blank" rel="noopener noreferrer">Vreeman &amp; Carroll, „Medical myths“, BMJ 2007;335:1288</a> (behandelt den 10-%-Mythos; Link am ${VDATE} per Suche gefunden, Internet nötig).</p></details>
<h2>Schritt 5 · Aussage überprüfen</h2><p>Wähle aus der KI-Antwort <b>eine konkrete Behauptung</b> aus, zum Beispiel mit Zahl, Datum, Name oder Quellenangabe. Allgemeine Sätze lassen sich schlecht prüfen. Ohne KI-Zugang nimmst du eine Aussage aus der Beispielantwort oben.</p>
<ol><li>Öffne die Quelle, die die KI nennt, selbst. Findest du sie nicht oder steht die Aussage dort nicht, ist das schon ein wichtiges Ergebnis.</li><li>Prüfe die Aussage mit einer <b>unabhängigen, seriösen Quelle</b>, zum Beispiel einem Museum, einer Universität, einer Raumfahrtorganisation oder einer Fachredaktion. Eine zweite Seite, die nur abschreibt, zählt nur als eine Quelle.</li><li>Achte auf Datum, Kontext und Messmethode. Eine Aussage kann für einen Zeitraum stimmen und für einen anderen nicht.</li></ol>
<h2>Schritt 6 · Ergebnis dokumentieren</h2><p class="tg">Trage nur Quellen ein, die du selbst geöffnet hast. Die Eingaben werden nicht gespeichert. Kopiere sie, wenn du sie behalten willst.</p>
<label class="k" for="dxb" style="display:block">Behauptung</label><textarea id="dxb" placeholder="Die Aussage aus der KI-Antwort, die du geprüft hast"></textarea>
<label class="k" for="dxs" style="display:block">Gefundene Quelle</label><input type="text" id="dxs" placeholder="Titel, Autor, Jahr oder Link. Nichts gefunden? Schreibe: keine gefunden">
<fieldset><legend>Ergebnis der Überprüfung</legend>${rad("dres",["bestätigt","widerlegt","nicht eindeutig geklärt"])}</fieldset>
<p class="tg"><b>bestätigt:</b> Eine seriöse Quelle stützt die Aussage. <b>widerlegt:</b> Eine seriöse Quelle widerspricht ihr. <b>nicht eindeutig geklärt:</b> Du findest keine klare Antwort oder die Quellen widersprechen sich. Ist die Quelle nicht auffindbar, gilt die Aussage als nicht belegt. Ob sie falsch ist, muss dann anders geklärt werden.</p>
<div class="row"><button class="b" onclick="dxSave()">Ergebnis festhalten</button><button class="b o" onclick="copyVal(dxText(),'dxm','Dokumentation kopiert. Du kannst sie jetzt einfügen.')">Dokumentation kopieren</button></div><p id="dxm" class="tg" role="status"></p>
<div class="bx-rc"><p class="k">Reflexion (freiwillig, ohne Punkte)</p><h2>Warum sollte man eine KI-Antwort nicht ungeprüft glauben?</h2><label class="k" for="rf" style="display:block">Deine Antwort</label><textarea id="rf" placeholder="Schreibe ein, zwei Sätze …"></textarea><p class="tg">Deine Antwort wird nicht gespeichert.</p></div>
<details class="card"><summary>Musterbeispiel anzeigen</summary><div class="sim">Eine KI berechnet, welches Wort wahrscheinlich als Nächstes passt. Sie prüft dabei nicht automatisch, ob die Aussage stimmt. Deshalb kann sie Zahlen, Zitate oder Quellen erfinden, die plausibel klingen und trotzdem falsch sind. Das nennt man Halluzination. Sie klingt dabei genauso sicher wie eine richtige Antwort. Darum öffne ich die Quelle selbst, vergleiche sie mit unabhängigen Quellen und achte auf Datum und Kontext. Die KI kann beim Suchen helfen, das Prüfen bleibt bei mir.</div></details>
<div id="abs"></div>`}
function test(){const{r,c}=pchk();$("out").innerHTML=`<div class="card res ${c>=2?"ok":"no"}"><h2>Prompt-Check: ${c} von ${PROMPT_MAX} Kriterien</h2>${PK.map((k,i)=>`<p class="ck ${r[i]?"y":"n"}">${r[i]?"✔":"✘"} ${k[0]}</p>`).join("")}<p class="tg">Der Check sucht nur Stichwörter in deinem Prompt. Er bewertet weder die Wahrheit der Behauptung noch eine echte KI-Antwort und vergibt keine Punkte.</p></div>`}

function copyVal(v,mid,okMsg){(async()=>{let ok=false;try{await navigator.clipboard.writeText(v);ok=true}catch(e){let t=null;try{t=document.createElement("textarea");t.value=v;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:-9999px;opacity:0";document.body.appendChild(t);t.select();ok=document.execCommand("copy")}catch(e2){}finally{if(t)t.remove()}}

function end(){if(Object.keys(R).length<C.length){go(`<section class="in"><p class="k">Ergebnis noch nicht verfügbar</p><div class="card"><h2>Erst das Hauptquiz abschließen</h2><p>Du hast ${Object.keys(R).length} von ${C.length} Fragen beantwortet. Das Ergebnis erscheint, sobald alle Fragen beantwortet sind.</p></div><div class="row"><button class="b" onclick="resume()">Weiter im Hauptquiz</button></div></section>`);return}const mp=mainPts(),bp=bonusPts(),tot=total(),right=Object.values(R).filter(r=>r.ok).length,qm=mp/KMAX;
const rk=qm<=.25?["KI-Anfänger","Zeit für den Faktencheck!"]:qm<=.6?["Fact Checker","schon ziemlich gut!"]:qm<=.85?["KI-Detektiv","starke Arbeit!"]:["Fact-Check-Profi","du glaubst nicht alles, was eine KI sagt!"];
const done=CHALL.filter(c=>B[c.k]&&B[c.k].done);

const next=!weak?"":weak.sh>=.75?"Du bist in allen Bereichen stark. Probiere jetzt die Zusatz-Challenges und die KI-Challenge, um deine Prüfung im Alltag zu üben.":`Nächster Schritt: „${weak.n}“. ${weak.tip}`;

if(right>=9)hints.push("Du hast die meisten Aussagen richtig eingeordnet.");

<div class="card"><h2>So entsteht dein Ergebnis</h2><p>Hauptquiz: ${mp} von ${KMAX} Punkten · Zusatz-Challenges: ${bp} von ${BMAX} Punkten</p><p class="tg">Gesamt: ${tot} von ${MAX} Punkten. Die Gesamtpunkte zeigen nur, wie viel du gelöst hast. Ob du Informationen zuverlässig prüfst, zeigen eher deine Begründungen, Quellenchecks und die Zusatz-Challenges.</p>${C.map((_,i)=>i).map(i=>{const x=R[i];return `<p class="ck ${x&&x.ok?"y":"n"}">${x?(x.ok?"✔":"✘"):"–"} Frage ${i+1} (${kid(i)}): ${L[C[i].a]}${x&&!x.ok?" – du: "+L[x.pick]:""}</p>`}).join("")}</div>

<div class="card"><p class="k">Was gut geklappt hat</p><ul>${hints.map(h=>`<li>${h}</li>`).join("")}</ul><p class="big">Eine überzeugend klingende Antwort ist nicht automatisch eine wahre Antwort.</p><p class="big">Vertrauen ≠ Überprüfen</p><p>KI kann beim Finden und Erklären helfen. Wichtige Informationen solltest du kritisch prüfen und mit mehreren unabhängigen, zuverlässigen Quellen vergleichen.</p></div>
<div class="card"><p class="k">Meine Strategie</p><h2>Wie gehe ich künftig mit KI-Antworten um?</h2><label class="k" for="strat" style="display:block">Formuliere eine Regel, die du beim nächsten Mal anwendest</label><textarea id="strat" placeholder="Zum Beispiel: Ich prüfe jede Zahl und jede Quelle, bevor ich sie weitergebe …"></textarea><p class="tg">Deine Strategie wird nicht gespeichert. Kopiere sie, wenn du sie behalten willst.</p></div><div class="card"><p class="k">Reflexion (freiwillig, ohne Punkte)</p><h2>Reflexion</h2>${RQ.map((t,i)=>`<label for="rq${i}"><b>${t}</b></label><textarea id="rq${i}"></textarea>`).join("")}<p class="tg">Deine Antworten werden nicht gespeichert. Kopiere sie, wenn du sie behalten willst.</p><div class="row"><button class="b o" onclick="cpAll()">Antworten kopieren</button><button class="b" onclick="document.getElementById('mk').hidden=false;this.hidden=true">Mit den Merksätzen vergleichen</button></div><p id="rcm" class="tg" role="status"></p><div id="mk" hidden><p><b>1.</b> Überraschung ist ein Signal: Dein Bauchgefühl ist kein Beweis, und eine Halluzination klingt genauso sicher wie ein Fakt.</p><p><b>2.</b> Prüfbedarf besteht bei sehr genauen Zahlen, Zitaten berühmter Personen, Quellenangaben ohne Link, Wörtern wie „immer“ und bei Aktuellem (Knowledge Cutoff).</p><p><b>3.</b> Quelle selbst öffnen, mindestens zwei unabhängige seriöse Quellen vergleichen, Datum und Kontext lesen – und nichts ungeprüft weitergeben.</p><p><b>4.</b> Ein besserer Prompt verlangt kritisches Prüfen, Unsicherheiten, überprüfbare Quellen und „erfinde nichts“. Eine Garantie ist das nicht.</p></div></div>

function printpage(){go(`<section class="in pv"><div class="noprint"><p class="k">Druckansicht</p><h2>Material zum Ausdrucken</h2><p>Der Button öffnet den Druckdialog deines Browsers. Dort kannst du auch „Als PDF speichern“ wählen; es wird nichts automatisch heruntergeladen.</p><p>Das sind Vorlagen. Gedruckt, zugeschnitten und in Umschläge gelegt sind sie erst, wenn du das getan hast. <span class="tag">Vorbereitung erforderlich</span></p><div class="row"><button class="b" onclick="printMode('tasks')">Aufgaben drucken (für Lernende)</button><button class="b o" onclick="printMode('keys')">Lösungen drucken (nur Lehrkraft)</button><button class="b o" onclick="home()">Zurück</button></div></div><div class="pg card tasks">${guideHTML()}</div><div class="pg tasks"><h2>Aussagekarten (${C.length})</h2><div class="pcs">${C.map((x,i)=>`<div class="pc"><p class="k">Karte ${i+1} · ${kid(i)} · ${x.c}</p><p class="st">${x.s}</p></div>`).join("")}</div></div><div class="pg tasks"><h2>Antwortkarten (3) und Reflexionskarte</h2><div class="pcs">${["fact","fake","check"].map(k=>`<div class="pc"><p class="st">${I[k]}</p><p>${AD[k]}</p></div>`).join("")}<div class="pc"><p class="k">Reflexionskarte (freiwillig)</p>${RQ.map(q=>`<p><b>${q}</b></p>`).join("")}</div></div></div><div class="pg tasks"><h2>Prompt-Karte</h2><p class="st">${CH_PROMPT}</p><p>Gib keine echten Namen, Passwörter oder Adressen ein. Ohne KI-Zugang: Beispielantwort verwenden.</p></div><div class="pg tasks"><h2>Quellenprüfungsbogen</h2><p>Trage deine Notizen ein. Nur Quellen eintragen, die du selbst geöffnet hast.</p><p><b>1 Behauptung der KI:</b></p><div class="lin"></div><p><b>2 Quelle (Titel, Herausgeber, Jahr, Link):</b></p><div class="lin"></div><p><b>3 Quelle geöffnet und gelesen? ja / nein</b></p><div class="lin"></div><p><b>4 Stimmen Aussage, Zahlen und Datum überein?</b></p><div class="lin"></div><p><b>5 Ergebnis: belegt / widerlegt / noch unklar</b></p><div class="lin"></div></div><div class="pg tasks"><h2>Reflexionsbogen</h2><p><b>${RQ[0]}</b></p><div class="lin"></div><div class="lin"></div><p><b>${RQ[1]}</b></p><div class="lin"></div><div class="lin"></div><p><b>${RQ[2]}</b></p><div class="lin"></div><div class="lin"></div><p><b>${RQ[3]}</b></p><div class="lin"></div><div class="lin"></div></div><div class="pg keys"><p class="k">Nur für die Lehrkraft · nicht an Lernende verteilen</p><h2>Lösungskarten (${C.length}, in Umschläge)</h2><div class="pcs">${C.map((x,i)=>`<div class="pc"><p class="k">Lösung zu Karte ${i+1} · ${kid(i)}</p><p class="st">${I[x.a]}</p><p>${x.e}</p><p><b>Prüfweg:</b> ${x.v}</p><p><b>Zum Überprüfen:</b> ${x.q}${x.u?" – "+x.u.map(u=>u[1]+": "+u[0]).join("; "):""}${x.n?" Unsicherheit: "+x.n:""}</p></div>`).join("")}</div></div></section>`)}

function stationInfo(){const raw=(STATION_URL||(/^https?:/.test(location.href)?location.href:"")).split("#")[0].trim();if(!raw)return{u:"",m:"Kein QR-Code möglich: Die Datei läuft lokal (file://) und hat keine öffentliche Adresse. Trage nach der Veröffentlichung die https-Adresse bei STATION_URL im Code ein."};let u;try{u=new URL(raw)}catch(e){return{u:"",m:"STATION_URL ist keine gültige Adresse."}}const h=u.hostname;if(u.protocol!=="https:")return{u:"",m:"Der QR-Code braucht eine öffentliche https-Adresse."};if(/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|\[?::1)/.test(h)||/\.(local|lan|internal)$/.test(h)||!h.includes("."))return{u:"",m:"Lokale oder private Adresse: Ein Smartphone außerhalb deines Netzes kann sie nicht öffnen."};return{u:u.href,m:""}}
function qrHTML(z){const s=stationInfo();if(!s.u)return `<div class="qrx" style="width:${z}px;height:${z}px">Kein QR-Code<br>verfügbar</div>`;return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&color=0b1226&bgcolor=e8eefb&data=${encodeURIComponent(s.u)}" alt="QR-Code zur Station" style="width:${z}px;height:${z}px" onerror="this.outerHTML='<div class=qrx>QR-Grafik nicht ladbar: Internet nötig</div>'">`}
function qrCard(){const s=stationInfo();return `<div class="card"><p class="k">Danach · digital</p><h2>Der QR-Code führt zur Station</h2><div class="bx-qr">${qrHTML(140)}</div>${s.u?`<p>Der QR-Code verweist auf: <b>${s.u}</b></p><p><a href="${s.u}" target="_blank" rel="noopener noreferrer">Adresse im Browser öffnen</a> – öffnet sich die Station, stimmt die Adresse.</p><label class="cl"><input type="checkbox"><span>Ich habe den QR-Code mit einem Smartphone gescannt und die Station hat sich geöffnet (eigener Test, wird nicht gespeichert).</span></label>`:`<div class="cfg"><p><b>Noch kein QR-Code:</b> ${s.m}</p><ol><li>Die HTML-Datei zuerst öffentlich hosten (Schulserver, Webspace oder ein Hosting-Dienst).</li><li>Die öffentliche https-Adresse kopieren.</li><li>Im Script ganz oben bei <code>STATION_URL</code> eintragen und die Seite neu laden.</li><li>Den QR-Code mit dem Smartphone scannen und testen.</li></ol></div>`}<p class="tg">Ein echter Scan-Test wurde nicht durchgeführt und ist erst nach der Veröffentlichung möglich. Die Grafik kommt von api.qrserver.com (Internet nötig, die Adresse wird dorthin übertragen).</p></div>`}
